## FLAGS: --validate-only
# Uses spontaneous-jump to stop execution in the middle of a basic block

- [0,1,0,0]
- [public-pc, spontaneous-jump]
-
  program:
    # Normal block
    - [mov, 0, null, true, 1]
    - [mov, 1, null, true, 2]
    - [add, 0, 0, false, 1]
    - [add, 1, 0, false, 1]
    - [add, 0, 0, false, 1]
    - [add, 1, 0, false, 1]

    # Spontaneous jump target (pc = 6)
    - [store8, null, 0, true, 1024]
    - [store8, null, 1, true, 1032]

  params:
    num_regs: 2

  init_mem: []

  segments:
    # Main secret segment for running the normal block
    - constraints: []
      len: 6
      enter_from_network: false
      exit_to_network: true
    - constraints: [[pc, 6], [spontaneous_jump, 6]]
      len: 2
      enter_from_network: true
      exit_to_network: false

  trace:
    - segment: 0
      states:
        - [1, [1, 0]]
        - [2, [1, 2]]
        - [3, [3, 2]]
        - [4, [3, 5]]
        # Normal execution results:
        #- [5, [8, 5]]
        #- [6, [8, 13]]
        # With stuttering:
        - [4, [3, 5]]
        - [4, [3, 5]]
    - segment: 1
      states:
        - [7, [3, 5]]
        - [8, [3, 5]]

  advice:
    5: [[Stutter]]
    6: [[Stutter]]
    7: [[MemOp, 1024, 3, write, 8]]
    8: [[MemOp, 1032, 5, write, 8]]
