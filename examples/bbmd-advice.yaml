## FLAGS: --validate-only
# BBMD example using the `adivse` instruction.  This requires adding advice
# inputs to the common basic block functions.

- [0,1,0,0]
- [bbmd]
-
  program:
    - [mov, 0, null, true, 5]

    # Top of loop (pc = 1)
    # Get advice to decide which branch to take.
    - [advise, 1, null, true, 1]
    - [cjmp, null, 1, true, 5]

    # Low bit is 0 (pc = 3)
    - [shr, 0, 0, true, 1]
    - [jmp, null, null, true, 1]

    # Low bit is 1 (pc = 5)
    - [mull, 0, 0, true, 3]
    - [add, 0, 0, true, 1]
    - [jmp, null, null, true, 1]

  params:
    num_regs: 2
    trace_len: 11
    bbmd: true

  bbmd_blocks:
    - pcs: [[0, 1]]
    # Condition check (1..3) and false case (3..5)
    - pcs: [[1, 5]]
    # Condition check (1..3) and true  case (5..8)
    - pcs: [[1, 3], [5, 8]]

  trace:
    - block: 0
      states:
        - [1, [5, 0]]

    - block: 2
      states:
        - [2, [5, 1]]
        - [5, [5, 1]]
        - [6, [15, 1]]
        - [7, [16, 1]]
        - [1, [16, 1]]

    - block: 1
      states:
        - [2, [16, 0]]
        - [3, [16, 0]]
        - [4, [8, 0]]
        - [1, [8, 0]]

    - block: 1
      states:
        - [2, [8, 0]]
        - [3, [8, 0]]
        - [4, [4, 0]]
        - [1, [4, 0]]

    - block: 1
      states:
        - [2, [4, 0]]
        - [3, [4, 0]]
        - [4, [2, 0]]
        - [1, [2, 0]]

    - block: 1
      states:
        - [2, [2, 0]]
        - [3, [2, 0]]
        - [4, [1, 0]]
        - [1, [1, 0]]

  advice:
    2: [[Advise, 1]]
    7: [[Advise, 0]]
    11: [[Advise, 0]]
    15: [[Advise, 0]]
    19: [[Advise, 0]]
